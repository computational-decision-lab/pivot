[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pivot-research"
version = "0.1.0"
description = "Paired Interventional Validation of Optimization Transitions"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "PyYAML>=6.0"]

[project.optional-dependencies]
parquet = ["pyarrow>=14"]
figures = ["matplotlib>=3.7"]
dev = ["pytest>=8", "ruff>=0.5", "mypy>=1.8", "pyarrow>=14", "matplotlib>=3.7"]
external = ["pettingzoo==1.27.0", "mpe2==1.1.0", "gymnasium==1.3.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["paper/iclr2027/supplementary"]

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true
