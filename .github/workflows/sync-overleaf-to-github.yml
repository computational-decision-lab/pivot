name: Sync Overleaf to GitHub

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: overleaf-paper
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Import Overleaf changes
        env:
          OVERLEAF_TOKEN: ${{ secrets.OVERLEAF_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$OVERLEAF_TOKEN"
          work=$(mktemp -d)
          trap 'rm -rf "$work"' EXIT
          cat > "$work/askpass" <<'ASKPASS'
          #!/bin/sh
          case "$1" in
            *Username*) printf '%s\n' git ;;
            *) printf '%s\n' "$OVERLEAF_TOKEN" ;;
          esac
          ASKPASS
          chmod 700 "$work/askpass"
          export GIT_ASKPASS="$work/askpass" GIT_TERMINAL_PROMPT=0
          git -c credential.helper= clone https://git.overleaf.com/6aab7ef4c95659076d75b579 "$work/overleaf"
          python3 scripts/import_overleaf.py "$work/overleaf"
          git config user.name 'GitHub paper sync'
          git config user.email 'paper-sync@users.noreply.github.com'
          git add -- paper
          if ! git diff --cached --quiet; then
            git commit -m 'Sync manuscript changes from Overleaf'
            git push origin HEAD:master
          fi
          # Record acknowledged content only after the GitHub push succeeds.
          # A retry is safe if either remote changes while the job is running.
          git -C "$work/overleaf" config user.name 'GitHub paper sync'
          git -C "$work/overleaf" config user.email 'paper-sync@users.noreply.github.com'
          git -C "$work/overleaf" add .github-sync.json
          if ! git -C "$work/overleaf" diff --cached --quiet; then
            git -C "$work/overleaf" commit -m "Acknowledge import to GitHub $(git rev-parse HEAD)"
            git -C "$work/overleaf" -c credential.helper= push origin "HEAD:$(git -C "$work/overleaf" branch --show-current)"
          fi
          echo 'Overleaf import and synchronization baseline verified.' >> "$GITHUB_STEP_SUMMARY"
