name: Sync Overleaf to GitHub

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: overleaf-paper
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Import Overleaf changes
        env:
          OVERLEAF_TOKEN: ${{ secrets.OVERLEAF_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$OVERLEAF_TOKEN"
          work=$(mktemp -d)
          trap 'rm -rf "$work"' EXIT
          cat > "$work/askpass" <<'ASKPASS'
          #!/bin/sh
          case "$1" in
            *Username*) printf '%s\n' git ;;
            *) printf '%s\n' "$OVERLEAF_TOKEN" ;;
          esac
          ASKPASS
          chmod 700 "$work/askpass"
          export GIT_ASKPASS="$work/askpass" GIT_TERMINAL_PROMPT=0
          git -c credential.helper= clone https://git.overleaf.com/6aab7ef4c95659076d75b579 "$work/overleaf"
          OVERLEAF_DIR="$work/overleaf" python3 - <<'PY'
          import os, pathlib, shutil
          root = pathlib.Path(os.environ['OVERLEAF_DIR'])
          dest = pathlib.Path('paper')
          allowed = {'.tex','.bib','.sty','.bst','.cls','.pdf','.png','.jpg','.jpeg','.eps'}
          skip = {'build','archive','supplementary','snapshot'}
          for p in root.rglob('*'):
              rel = p.relative_to(root)
              if '.git' in rel.parts or rel.name in {'.github-sync.json','latexmkrc'} or any(x in skip for x in rel.parts): continue
              if p.is_file() and p.suffix in allowed:
                  out = dest / rel
                  out.parent.mkdir(parents=True, exist_ok=True)
                  data = p.read_bytes()
                  if rel.as_posix() == 'main.tex': data = data.replace(b'tables/', b'../tables/')
                  out.write_bytes(data)
          PY
          if git diff --quiet -- paper; then
            echo 'No Overleaf changes to import.'
            exit 0
          fi
          git config user.name 'GitHub paper sync'
          git config user.email 'paper-sync@users.noreply.github.com'
          git add paper
          git commit -m 'Sync manuscript changes from Overleaf'
          git push origin HEAD:master
