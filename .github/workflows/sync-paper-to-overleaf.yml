name: Sync paper to Overleaf
on:
  push:
    branches: [master]
    paths: ['paper/**', '.github/workflows/sync-paper-to-overleaf.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: overleaf-paper
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - name: Sync manuscript safely
        env:
          OVERLEAF_TOKEN: ${{ secrets.OVERLEAF_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$OVERLEAF_TOKEN"
          work=$(mktemp -d)
          trap 'rm -rf "$work"' EXIT
          cat > "$work/askpass" <<'ASKPASS'
          #!/bin/sh
          case "$1" in
            *Username*) printf '%s\n' git ;;
            *) printf '%s\n' "$OVERLEAF_TOKEN" ;;
          esac
          ASKPASS
          chmod 700 "$work/askpass"
          export GIT_ASKPASS="$work/askpass" GIT_TERMINAL_PROMPT=0
          git -c credential.helper= clone https://git.overleaf.com/6aab7ef4c95659076d75b579 "$work/overleaf"
          export SYNC_DEST="$work/overleaf"
          python3 - <<'PY'
          import hashlib, json, os, pathlib, subprocess
          root = pathlib.Path(os.environ['SYNC_DEST'])
          state = root / '.github-sync.json'
          expected_baseline = '221c2602e4826a86b274e70eeeefc22c405a9dd9'
          def digest(p): return hashlib.sha256(p.read_bytes()).hexdigest()
          def eligible(path):
              return (
                  path.is_file()
                  and '.git' not in path.relative_to(root).parts
                  and path.suffix in {'.tex', '.bib', '.sty', '.bst', '.cls', '.pdf', '.png', '.jpg', '.jpeg', '.eps'}
                  and not path.name.startswith('pivot_iclr2027_submission')
              )
          if state.exists():
              old = json.loads(state.read_text())['files']
              for name, expected in old.items():
                  p = root / name
                  if not p.is_file() or digest(p) != expected:
                      raise SystemExit(f'Overleaf edited {name}; reconcile before syncing.')
          else:
              remote_head = subprocess.check_output(['git', '-C', str(root), 'rev-parse', 'HEAD'], text=True).strip()
              if remote_head != expected_baseline:
                  raise SystemExit(
                      f'Overleaf sync state is missing and remote HEAD is {remote_head}; '
                      f'expected reviewed collaborator baseline {expected_baseline}.'
                  )
              # The collaborator's current project intentionally has no
              # state file. Treat the reviewed 221c260 tree as the immutable
              # baseline and initialize state only after the payload is
              # applied below.
              old = {
                  p.relative_to(root).as_posix(): digest(p)
                  for p in root.rglob('*')
                  if eligible(p)
              }
          source = pathlib.Path('paper')
          assert (source / 'main.tex').is_file()
          payload = {}
          def add(rel, destination):
              path = source / rel
              if not path.is_file():
                  return
              data = path.read_bytes()
              if destination == 'main.tex':
                  data = data.replace(b'../tables/', b'tables/')
              payload[destination] = data
          add(pathlib.Path('main.tex'), 'main.tex')
          for name in ('references.bib', 'results_macros.tex', 'revision_results.tex', 'highway_results.tex'):
              add(pathlib.Path(name), name)
          for name in ('fancyhdr.sty', 'iclr2027_conference.sty', 'natbib.sty', 'iclr2027_conference.bst'):
              candidate = pathlib.Path('style') / name
              if (source / candidate).is_file():
                  add(candidate, name)
              else:
                  add(pathlib.Path(name), name)
          for name in ('controlled_results.tex', 'highway_results.tex', 'public_results.tex', 'revision_main_results.tex'):
              add(pathlib.Path('tables') / name, f'tables/{name}')
          figures = source / 'figures'
          if figures.is_dir():
              for path in sorted(figures.iterdir()):
                  if path.is_file() and path.suffix in {'.pdf', '.png', '.jpg', '.jpeg', '.eps'}:
                      add(path.relative_to(source), f'figures/{path.name}')
          for name in payload:
              p = root / name
              if name not in old and p.exists():
                  raise SystemExit(f'Unmanaged Overleaf file collision: {name}')
          if state.exists():
              for name in old.keys() - payload.keys():
                  p = root / name
                  if p.exists():
                      p.unlink()
          for name, data in payload.items():
              p = root / name
              p.parent.mkdir(parents=True, exist_ok=True)
              p.write_bytes(data)
          (root / 'latexmkrc').write_text("$ENV{'TEXINPUTS'}='./style//:' . ($ENV{'TEXINPUTS'} // '');\n$ENV{'BSTINPUTS'}='./style//:' . ($ENV{'BSTINPUTS'} // '');\n")
          hashes = {name: digest(root/name) for name in payload}
          hashes['latexmkrc'] = digest(root/'latexmkrc')
          state.write_text(json.dumps({'github_commit':os.environ['GITHUB_SHA'],'files':hashes},indent=2)+'\n')
          PY
          cd "$work/overleaf"
          git config user.name 'GitHub paper sync'
          git config user.email 'paper-sync@users.noreply.github.com'
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Sync GitHub paper ${GITHUB_SHA}"
            git -c credential.helper= push origin "HEAD:$(git branch --show-current)"
          fi
          echo "### Overleaf synchronized" >> "$GITHUB_STEP_SUMMARY"
          echo "GitHub commit: ${GITHUB_SHA}" >> "$GITHUB_STEP_SUMMARY"
          echo "Project: https://www.overleaf.com/project/6aab7ef4c95659076d75b579" >> "$GITHUB_STEP_SUMMARY"
