name: Temporary Overleaf sync experiment
on:
  workflow_dispatch:
    inputs:
      mode:
        required: true
        type: choice
        options: [forward-and-edit, cleanup]
permissions:
  contents: read
concurrency:
  group: overleaf-paper
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - name: Verify actual Overleaf content
        env:
          OVERLEAF_TOKEN: ${{ secrets.OVERLEAF_TOKEN }}
          MODE: ${{ inputs.mode }}
        run: |
          set -euo pipefail
          work=$(mktemp -d)
          trap 'rm -rf "$work"' EXIT
          cat > "$work/askpass" <<'ASK'
          #!/bin/sh
          case "$1" in
            *Username*) printf '%s\n' git ;;
            *) printf '%s\n' "$OVERLEAF_TOKEN" ;;
          esac
          ASK
          chmod 700 "$work/askpass"
          export GIT_ASKPASS="$work/askpass" GIT_TERMINAL_PROMPT=0
          git -c credential.helper= clone https://git.overleaf.com/6aab7ef4c95659076d75b579 "$work/overleaf"
          probe=codex_sync_probe_20260917.tex
          if [ "$MODE" = cleanup ]; then
            test ! -e "$work/overleaf/$probe"
            test ! -e "paper/$probe"
            echo 'PASS: test file absent on both GitHub and Overleaf.'
            exit 0
          fi
          cmp "paper/$probe" "$work/overleaf/$probe"
          test "$(cat "$work/overleaf/$probe")" = '% sync experiment: GitHub to Overleaf 20260917'
          echo 'PASS: Overleaf content matches GitHub probe byte-for-byte.'
          sha256sum "$work/overleaf/$probe"
          printf '%% sync experiment: Overleaf to GitHub 20260917\n' > "$work/overleaf/$probe"
          git -C "$work/overleaf" config user.name 'Sync experiment'
          git -C "$work/overleaf" config user.email 'paper-sync@users.noreply.github.com'
          git -C "$work/overleaf" add "$probe"
          git -C "$work/overleaf" commit -m 'test: reverse sync probe edited on Overleaf'
          git -C "$work/overleaf" -c credential.helper= push origin "HEAD:$(git -C "$work/overleaf" branch --show-current)"
          echo 'PASS: reverse probe committed directly to Overleaf; GitHub not modified by this job.'
